<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Vroum !"/>
<title>Vroum !</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#080D1A;--card:#0F1729;--el:#162035;--border:#1D2D45;--acc:#00C896;--blue:#3B82F6;--warn:#F59E0B;--danger:#EF4444;--text:#E2E8F0;--muted:#64748B;--sub:#1E2D45}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,20px)+10px) 16px 10px;background:#0A1020;border-bottom:1px solid var(--border);flex-shrink:0}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
#bnav{display:flex;background:#0A1020;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0}
.logo{font-size:20px;font-weight:900;color:var(--acc)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;cursor:pointer;font-size:10px;font-weight:600;color:var(--muted)}
.ntab.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.kl{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:26px;font-weight:800;line-height:1}
.ks{font-size:11px;color:var(--muted);margin-top:5px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--sub)}
.row:last-child{border-bottom:none}
.rl{font-size:13px;font-weight:600;color:var(--text)}
.rs{font-size:11px;color:var(--muted);margin-top:2px}
.ra{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:8px}
.badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(0,200,150,.12);color:var(--acc)}.bb{background:rgba(59,130,246,.12);color:var(--blue)}
.ba{background:rgba(245,158,11,.12);color:var(--warn)}.br{background:rgba(239,68,68,.12);color:var(--danger)}.bx{background:var(--el);color:var(--muted)}
.fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));right:20px;width:54px;height:54px;border-radius:50%;background:var(--acc);border:none;font-size:28px;color:#000;cursor:pointer;box-shadow:0 4px 16px rgba(0,200,150,.4);z-index:20}
.stabs{display:flex;gap:2px;background:var(--el);border-radius:10px;padding:3px;margin-bottom:14px}
.stab{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.stab.on{background:var(--acc);color:#000}
.empty{text-align:center;padding:40px 0;color:var(--muted)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:90dvh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,20px)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 10px;border-bottom:1px solid var(--border)}
.sheet-title{font-size:17px;font-weight:700}
.sheet-body{padding:16px 20px}
.sheet-foot{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
input,select{background:var(--el);border:1px solid var(--border);border-radius:10px;padding:12px 13px;font-size:16px;color:var(--text);font-family:inherit;width:100%;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--acc)}
.btn{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
.btn-p{background:var(--acc);color:#000}
.btn-g{background:var(--el);color:var(--text)}
.bsm{padding:6px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border);background:var(--el);color:var(--text);cursor:pointer;font-family:inherit}
.bsm-d{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--danger)}
/* Code */
#code-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:32px;z-index:100}
/* Notif */
#notif{position:fixed;top:calc(env(safe-area-inset-top,20px)+56px);left:16px;right:16px;z-index:99;text-align:center;pointer-events:none}
.notif-inner{display:inline-block;padding:10px 20px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;max-width:320px}
.notif-inner.show{opacity:1}
</style>
</head>
<body>

<div id="code-screen">
  <div style="font-size:52px;margin-bottom:12px">🚗</div>
  <div style="font-size:28px;font-weight:900;color:var(--acc);margin-bottom:8px">Vroum !</div>
  <div style="font-size:14px;color:var(--muted);margin-bottom:32px">Entrez le code d'accès</div>
  <input id="code-in" style="background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px;font-size:22px;color:var(--text);width:100%;max-width:280px;text-align:center;letter-spacing:3px;text-transform:uppercase;font-family:inherit;outline:none;margin-bottom:12px" type="text" placeholder="CODE" autocomplete="off" autocorrect="off" spellcheck="false"/>
  <button id="code-btn" style="background:var(--acc);color:#000;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;width:100%;max-width:280px;cursor:pointer;font-family:inherit">Accéder</button>
  <div id="code-err" style="color:var(--danger);font-size:13px;margin-top:10px;min-height:20px"></div>
</div>

<div id="app" style="display:none">
  <div id="topbar">
    <div class="logo">🚗 Vroum !</div>
    <div id="sync-info" style="font-size:11px;color:var(--muted)"></div>
  </div>
  <div id="content"></div>
  <div id="bnav"></div>
</div>

<div id="notif"><div class="notif-inner" id="notif-msg"></div></div>
<div id="modal-root"></div>

<script>
// ── Config ──────────────────────────────────────────────────────
var CODES = ['VROUM','VROUM2025','FLEET'];
var SB_URL = 'https://bpboyrmgluzvdowhfvoj.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwYm95cm1nbHV6dmRvd2hmdm9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTI5NDAsImV4cCI6MjA5MzQ2ODk0MH0.TDpw7cC3CCuG2lcWeo2QaVd2XdBXIZMyo5m1Dy6sc8M';

// ── Notification ────────────────────────────────────────────────
var _nt = null;
function notif(msg, ok) {
  var el = document.getElementById('notif-msg');
  el.textContent = msg;
  el.style.background = ok ? 'rgba(0,200,150,.95)' : 'rgba(239,68,68,.95)';
  el.style.color = ok ? '#000' : '#fff';
  el.classList.add('show');
  if (_nt) clearTimeout(_nt);
  _nt = setTimeout(function(){ el.classList.remove('show'); }, 4000);
}

// ── State ───────────────────────────────────────────────────────
var D = { vehicles:[], drivers:[], insurances:[], controls:[], maintenances:[], repairs:[], fuelLogs:[], reservations:[] };
var TAB = 'home';
var STAB = { fleet:'v', entretien:'m', plus:'res' };

function save(key) {
  try { localStorage.setItem('vroum_'+key, JSON.stringify(D[key])); } catch(e){}
  // Async Supabase sync
  fetch(SB_URL+'/vroum_data', {
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({key:key,value:D[key]})
  }).catch(function(){});
}

function load() {
  // Load from localStorage first (instant)
  Object.keys(D).forEach(function(k) {
    try { var v=localStorage.getItem('vroum_'+k); if(v) D[k]=JSON.parse(v); } catch(e){}
  });
  // Then try Supabase (background sync)
  fetch(SB_URL+'/vroum_data?select=key,value', {
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  }).then(function(r){ return r.ok?r.json():Promise.reject(r.status); })
  .then(function(rows){
    rows.forEach(function(row){ if(D.hasOwnProperty(row.key)&&Array.isArray(row.value)&&row.value.length>0) D[row.key]=row.value; });
    Object.keys(D).forEach(function(k){ try{localStorage.setItem('vroum_'+k,JSON.stringify(D[k]));}catch(e){} });
    document.getElementById('sync-info').textContent = '☁ Sync';
    render();
  }).catch(function(){ document.getElementById('sync-info').textContent = '📱 Local'; });
}

// ── Helpers ─────────────────────────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function eur(n){ return n!=null?Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}):'—'; }
function fdt(s){ return s?new Date(s).toLocaleDateString('fr-FR'):'—'; }
function daysTo(s){ return s?Math.ceil((new Date(s)-Date.now())/86400000):9999; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function vname(id){ var v=D.vehicles.find(function(x){return x.id===id;}); return v?v.plate+' '+v.brand:id; }
function dname(id){ var d=D.drivers.find(function(x){return x.id===id;}); return d?d.name:'—'; }
function sbadge(s){ var m={active:'bg Actif',available:'bb Dispo',maintenance:'ba Entretien',inactive:'bx Inactif',confirmed:'bg Confirmé',pending:'ba En attente',canceled:'br Annulé'}; var p=(m[s]||'bx '+s).split(' '); return '<span class="badge '+p[0]+'">'+esc(p.slice(1).join(' '))+'</span>'; }

// ── Views ───────────────────────────────────────────────────────
function alerts() {
  var a=[];
  D.insurances.forEach(function(i){ var v=D.vehicles.find(function(x){return x.id===i.vehicleId;}); var n=daysTo(i.endDate); if(n<=30)a.push({text:'Assurance '+(v?v.plate:'?')+' dans '+n+'j',c:'warn'}); });
  D.controls.forEach(function(c){ var v=D.vehicles.find(function(x){return x.id===c.vehicleId;}); var n=daysTo(c.nextDate); if(n<=60)a.push({text:'CT '+(v?v.plate:'?')+' dans '+n+'j',c:n<=14?'danger':'warn'}); });
  D.maintenances.forEach(function(m){ var v=D.vehicles.find(function(x){return x.id===m.vehicleId;}); if(!v)return; var d=daysTo(m.nextDate); if(d<=30)a.push({text:'Entretien '+v.plate+(d<=0?' en retard':' dans '+d+'j'),c:d<=0?'danger':'warn'}); });
  return a;
}

function homeView() {
  var al=alerts(), crits=al.filter(function(x){return x.c==='danger';}).length;
  var now=new Date(), m=now.getMonth(), y=now.getFullYear();
  var mc=D.fuelLogs.concat(D.maintenances).filter(function(f){var x=new Date(f.date);return x.getMonth()===m&&x.getFullYear()===y;}).reduce(function(s,f){return s+(f.totalCost||f.cost||0);},0);
  return '<div class="kg">'
    +'<div class="kpi"><div class="kl">Véhicules</div><div class="kv">'+D.vehicles.length+'</div><div class="ks">'+D.vehicles.filter(function(v){return v.status==='active';}).length+' actifs</div></div>'
    +'<div class="kpi"><div class="kl">Alertes</div><div class="kv" style="color:'+(crits?'#EF4444':al.length?'#F59E0B':'#00C896')+'">'+al.length+'</div><div class="ks">'+crits+' critiques</div></div>'
    +'<div class="kpi"><div class="kl">Ce mois</div><div class="kv" style="font-size:18px">'+eur(mc)+'</div><div class="ks">Carb + entretien</div></div>'
    +'<div class="kpi"><div class="kl">Réservations</div><div class="kv">'+D.reservations.filter(function(r){return new Date(r.startDate)>=new Date()&&r.status!=='canceled';}).length+'</div><div class="ks">À venir</div></div>'
    +'</div>'
    +'<div class="card"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">Alertes</div>'
    +(al.length?al.map(function(a){return'<div class="row"><div class="rl">'+esc(a.text)+'</div></div>';}).join(''):'<div class="empty">✓ Tout est OK</div>')
    +'</div>';
}

function fleetView() {
  var st=STAB.fleet;
  var h='<div class="stabs"><div class="stab '+(st==='v'?'on':'')+'" onclick="setStab(\'fleet\',\'v\')">Véhicules</div><div class="stab '+(st==='d'?'on':'')+'" onclick="setStab(\'fleet\',\'d\')">Conducteurs</div></div>';
  if(st==='v'){
    if(!D.vehicles.length) return h+'<div class="empty">Aucun véhicule — tapez + pour ajouter</div><button class="fab" onclick="openModal(\'vehicle\',null)">+</button>';
    h+=D.vehicles.map(function(v){
      var drv=D.drivers.find(function(d){return d.id===v.driverId;});
      var sp=(({active:'bg Actif',available:'bb Dispo',maintenance:'ba Entretien',inactive:'bx Inactif'})[v.status]||'bx Inconnu').split(' ');
      return '<div class="card" style="margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div><div style="font-size:18px;font-weight:800;letter-spacing:.5px">'+esc(v.plate)+'</div><div style="font-size:13px;color:var(--muted)">'+esc(v.brand)+' '+esc(v.model)+' · '+v.year+'</div></div>'
        +'<span class="badge '+sp[0]+'">'+esc(sp.slice(1).join(' '))+'</span></div>'
        +'<div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'
        +'<div style="font-size:11px;color:var(--muted)"><div style="font-size:13px;font-weight:600;color:var(--text)">'+v.mileage.toLocaleString('fr-FR')+' km</div>Km</div>'
        +'<div style="font-size:11px;color:var(--muted)"><div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(v.fuelType||'—')+'</div>Énergie</div>'
        +'<div style="font-size:11px;color:var(--muted)"><div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(drv?drv.name:'—')+'</div>Conducteur</div>'
        +'</div>'
        +'<div style="display:flex;gap:8px;margin-top:12px">'
        +'<button class="bsm" onclick="openModal(\'vehicle\',\''+v.id+'\')">✏ Modifier</button>'
        +'<button class="bsm bsm-d" onclick="del(\'vehicles\',\''+v.id+'\')">🗑</button>'
        +'</div></div>';
    }).join('');
  } else {
    if(!D.drivers.length) return h+'<div class="empty">Aucun conducteur</div><button class="fab" onclick="openModal(\'driver\',null)">+</button>';
    h+=D.drivers.map(function(d){
      var veh=D.vehicles.find(function(v){return v.driverId===d.id;});
      return '<div class="card" style="margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center">'
        +'<div><div style="font-size:15px;font-weight:700">'+esc(d.name)+'</div><div style="font-size:12px;color:var(--muted)">'+esc(d.phone||'')+'</div></div>'
        +(veh?'<span class="badge bb">'+esc(veh.plate)+'</span>':'<span class="badge bx">—</span>')
        +'</div>'
        +'<div style="display:flex;gap:8px;margin-top:12px">'
        +'<button class="bsm" onclick="openModal(\'driver\',\''+d.id+'\')">✏ Modifier</button>'
        +'<button class="bsm bsm-d" onclick="del(\'drivers\',\''+d.id+'\')">🗑</button>'
        +'</div></div>';
    }).join('');
  }
  h+='<button class="fab" onclick="openModal(\''+(st==='v'?'vehicle':'driver')+'\',null)">+</button>';
  return h;
}

function entretienView() {
  var st=STAB.entretien;
  var h='<div class="stabs"><div class="stab '+(st==='m'?'on':'')+'" onclick="setStab(\'entretien\',\'m\')">Entretiens</div><div class="stab '+(st==='i'?'on':'')+'" onclick="setStab(\'entretien\',\'i\')">Assurances</div><div class="stab '+(st==='ct'?'on':'')+'" onclick="setStab(\'entretien\',\'ct\')">CT</div></div><div class="card">';
  if(st==='m'){
    if(!D.maintenances.length) h+='<div class="empty">Aucun entretien</div>';
    D.maintenances.forEach(function(m){var dc=daysTo(m.nextDate);h+='<div class="row"><div><div class="rl">'+esc(m.type)+'</div><div class="rs">'+esc(vname(m.vehicleId))+'</div><div style="font-size:11px;color:'+(dc<0?'#EF4444':dc<30?'#F59E0B':'#94A3B8')+';margin-top:3px">Prochain : '+fdt(m.nextDate)+'</div></div><div class="ra"><span style="font-size:13px;font-weight:700">'+eur(m.cost)+'</span><button class="bsm" onclick="openModal(\'maintenance\',\''+m.id+'\')">✏</button><button class="bsm bsm-d" onclick="del(\'maintenances\',\''+m.id+'\')">🗑</button></div></div>';});
  } else if(st==='i'){
    if(!D.insurances.length) h+='<div class="empty">Aucune assurance</div>';
    D.insurances.forEach(function(i){var n=daysTo(i.endDate);h+='<div class="row"><div><div class="rl">'+esc(i.provider)+'</div><div class="rs">'+esc(vname(i.vehicleId))+' · '+esc(i.type||'')+'</div><div style="font-size:11px;color:'+(n<30?'#F59E0B':'#94A3B8')+';margin-top:3px">'+fdt(i.endDate)+(n<=30?' (J-'+n+')':'')+'</div></div><div class="ra"><span style="font-size:13px;font-weight:700">'+eur(i.annualCost)+'</span><button class="bsm" onclick="openModal(\'insurance\',\''+i.id+'\')">✏</button><button class="bsm bsm-d" onclick="del(\'insurances\',\''+i.id+'\')">🗑</button></div></div>';});
  } else {
    if(!D.controls.length) h+='<div class="empty">Aucun CT</div>';
    D.controls.forEach(function(ct){var n=daysTo(ct.nextDate);h+='<div class="row"><div><div class="rl">'+esc(vname(ct.vehicleId))+'</div><div class="rs">'+esc(ct.result||'')+'</div><div style="font-size:11px;color:'+(n<60?'#F59E0B':'#94A3B8')+';margin-top:3px">Prochain : '+fdt(ct.nextDate)+(n<60&&n>0?' (J-'+n+')':'')+'</div></div><div class="ra"><span class="badge '+(ct.result==='Favorable'?'bg':'br')+'">'+(ct.result==='Favorable'?'✓':'✗')+'</span><button class="bsm" onclick="openModal(\'control\',\''+ct.id+'\')">✏</button><button class="bsm bsm-d" onclick="del(\'controls\',\''+ct.id+'\')">🗑</button></div></div>';});
  }
  h+='</div><button class="fab" onclick="openModal(\''+(st==='m'?'maintenance':st==='i'?'insurance':'control')+'\',null)">+</button>';
  return h;
}

function fuelView() {
  var sorted=D.fuelLogs.slice().sort(function(a,b){return+new Date(b.date)-+new Date(a.date);});
  var h='<div class="card"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">Historique</div>';
  if(!sorted.length) h+='<div class="empty">Aucun plein enregistré</div>';
  sorted.forEach(function(f){h+='<div class="row"><div><div class="rl">'+esc(vname(f.vehicleId))+'</div><div class="rs">'+fdt(f.date)+' · '+f.liters+'L · '+f.pricePerLiter+'€/L</div></div><div class="ra"><span style="font-size:13px;font-weight:700;color:#00C896">'+eur(f.totalCost)+'</span><button class="bsm bsm-d" onclick="del(\'fuelLogs\',\''+f.id+'\')">🗑</button></div></div>';});
  h+='</div><button class="fab" onclick="openModal(\'fuel\',null)">+</button>';
  return h;
}

function plusView() {
  var st=STAB.plus;
  var h='<div class="stabs"><div class="stab '+(st==='res'?'on':'')+'" onclick="setStab(\'plus\',\'res\')">Réservations</div><div class="stab '+(st==='rep'?'on':'')+'" onclick="setStab(\'plus\',\'rep\')">Réparations</div></div><div class="card">';
  if(st==='res'){
    var res=D.reservations.slice().sort(function(a,b){return+new Date(a.startDate)-+new Date(b.startDate);});
    if(!res.length) h+='<div class="empty">Aucune réservation</div>';
    res.forEach(function(r){h+='<div class="row"><div><div class="rl">'+esc(vname(r.vehicleId))+'</div><div class="rs">'+esc(dname(r.driverId))+' · '+fdt(r.startDate)+' → '+fdt(r.endDate)+'</div>'+(r.purpose?'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+esc(r.purpose)+'</div>':'')+'</div><div class="ra">'+sbadge(r.status)+'<button class="bsm" onclick="openModal(\'reservation\',\''+r.id+'\')">✏</button><button class="bsm bsm-d" onclick="del(\'reservations\',\''+r.id+'\')">🗑</button></div></div>';});
  } else {
    var rep=D.repairs.slice().sort(function(a,b){return+new Date(b.date)-+new Date(a.date);});
    if(!rep.length) h+='<div class="empty">Aucune réparation</div>';
    rep.forEach(function(r){h+='<div class="row"><div><div class="rl">'+esc(r.description)+'</div><div class="rs">'+esc(vname(r.vehicleId))+' · '+fdt(r.date)+'</div></div><div class="ra"><span style="font-size:13px;font-weight:700;color:#F59E0B">'+eur(r.cost)+'</span><button class="bsm bsm-d" onclick="del(\'repairs\',\''+r.id+'\')">🗑</button></div></div>';});
  }
  h+='</div><button class="fab" onclick="openModal(\''+(st==='res'?'reservation':'repair')+'\',null)">+</button>';
  return h;
}

// ── Nav ─────────────────────────────────────────────────────────
var TABS=[['home','🏠','Accueil'],['fleet','🚗','Flotte'],['entretien','🔧','Entretien'],['fuel','⛽','Carburant'],['plus','•••','Plus']];
function render() {
  var views={home:homeView,fleet:fleetView,entretien:entretienView,fuel:fuelView,plus:plusView};
  document.getElementById('content').innerHTML=(views[TAB]||homeView)();
  document.getElementById('bnav').innerHTML=TABS.map(function(t){return'<div class="ntab '+(TAB===t[0]?'on':'')+'" onclick="goTab(\''+t[0]+'\')" style="cursor:pointer">'+t[1]+'<span>'+t[2]+'</span></div>';}).join('');
}
function goTab(t){TAB=t;render();}
function setStab(k,v){STAB[k]=v;render();}
function del(arr,id){if(!confirm('Supprimer ?'))return;D[arr]=D[arr].filter(function(x){return x.id!==id;});render();save(arr);notif('Supprimé',true);}

// ── Modal ───────────────────────────────────────────────────────
var MODAL_ENTITY=null, MODAL_ID=null;

function fi(lbl,name,val,type,ph){return'<div class="fg"><label>'+lbl+'</label><input type="'+(type||'text')+'" name="'+name+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"/></div>';}
function fsel(lbl,name,val,opts){var h='<div class="fg"><label>'+lbl+'</label><select name="'+name+'"><option value="">— Choisir —</option>';opts.forEach(function(o){var v=o.v||o,l=o.l||o;h+='<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(l)+'</option>';});return h+'</select></div>';}

function openModal(entity, id) {
  MODAL_ENTITY=entity; MODAL_ID=id;
  var KEY={vehicle:'vehicles',driver:'drivers',maintenance:'maintenances',insurance:'insurances',control:'controls',fuel:'fuelLogs',reservation:'reservations',repair:'repairs'};
  var arr=D[KEY[entity]]||[];
  var i=(id?arr.find(function(x){return x.id===id;}):null)||{};
  var titles={vehicle:'Véhicule',driver:'Conducteur',maintenance:'Entretien',insurance:'Assurance',control:'Contrôle technique',fuel:'Plein de carburant',reservation:'Réservation',repair:'Réparation'};
  var body='';
  var vOpts=D.vehicles.map(function(v){return{v:v.id,l:v.plate+' — '+v.brand+' '+v.model};});
  var dOpts=D.drivers.map(function(d){return{v:d.id,l:d.name};});
  switch(entity){
    case 'vehicle': body=fi('Immatriculation','plate',i.plate,'text','AB-123-CD')+fi('Marque','brand',i.brand)+fi('Modèle','model',i.model)+fi('Année','year',i.year,'number')+fi('Kilométrage','mileage',i.mileage,'number')+fsel('Énergie','fuelType',i.fuelType,['Diesel','Essence','Hybride','Électrique','GPL'])+fsel('Statut','status',i.status,[{v:'active',l:'Actif'},{v:'available',l:'Disponible'},{v:'maintenance',l:'En entretien'},{v:'inactive',l:'Inactif'}])+fsel('Conducteur','driverId',i.driverId,dOpts)+fi("Date d'achat",'purchaseDate',i.purchaseDate,'date')+fi("Prix d'achat (€)",'purchasePrice',i.purchasePrice,'number'); break;
    case 'driver': body=fi('Nom','name',i.name)+fi('N° Permis','license',i.license)+fi('Expiration permis','licenseExpiry',i.licenseExpiry,'date')+fi('Téléphone','phone',i.phone,'tel')+fi('Email','email',i.email,'email'); break;
    case 'maintenance': body=fsel('Véhicule','vehicleId',i.vehicleId,vOpts)+fi('Type','type',i.type,'text','Vidange…')+fi('Date','date',i.date,'date')+fi('Km effectué','mileageDone',i.mileageDone,'number')+fi('Coût (€)','cost',i.cost,'number')+fi('Prestataire','provider',i.provider)+fi('Prochain RDV','nextDate',i.nextDate,'date')+fi('Prochain Km','nextMileage',i.nextMileage,'number'); break;
    case 'insurance': body=fsel('Véhicule','vehicleId',i.vehicleId,vOpts)+fi('Assureur','provider',i.provider)+fi('N° Police','policy',i.policy)+fsel('Type','type',i.type,['Tous risques','Tiers','Flotte'])+fi('Début','startDate',i.startDate,'date')+fi('Fin','endDate',i.endDate,'date')+fi('Coût annuel (€)','annualCost',i.annualCost,'number'); break;
    case 'control': body=fsel('Véhicule','vehicleId',i.vehicleId,vOpts)+fi('Date CT','date',i.date,'date')+fi('Prochain CT','nextDate',i.nextDate,'date')+fsel('Résultat','result',i.result,['Favorable','Défavorable'])+fi('Coût (€)','cost',i.cost,'number'); break;
    case 'fuel': body=fsel('Véhicule','vehicleId',i.vehicleId,vOpts)+fi('Date','date',i.date||new Date().toISOString().slice(0,10),'date')+fi('Litres','liters',i.liters,'number','52')+fi('Prix/L (€)','pricePerLiter',i.pricePerLiter,'number','1.72')+fi('Total (€)','totalCost',i.totalCost,'number','auto')+fi('Kilométrage','mileage',i.mileage,'number'); break;
    case 'reservation': body=fsel('Véhicule','vehicleId',i.vehicleId,vOpts)+fsel('Conducteur','driverId',i.driverId,dOpts)+fi('Départ','startDate',i.startDate,'date')+fi('Retour','endDate',i.endDate,'date')+fi('Motif','purpose',i.purpose,'text','Déplacement…')+fsel('Statut','status',i.status||'pending',[{v:'pending',l:'En attente'},{v:'confirmed',l:'Confirmé'},{v:'canceled',l:'Annulé'}]); break;
    case 'repair': body=fsel('Véhicule','vehicleId',i.vehicleId,vOpts)+fi('Date','date',i.date||new Date().toISOString().slice(0,10),'date')+fi('Description','description',i.description,'text','Remplacement…')+fi('Prestataire','provider',i.provider)+fi('Coût (€)','cost',i.cost,'number')+fi('Kilométrage','mileage',i.mileage,'number'); break;
  }
  document.getElementById('modal-root').innerHTML='<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><span class="sheet-title">'+(id?'Modifier':'Nouveau')+' '+titles[entity]+'</span><button onclick="closeModal()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0">×</button></div><div class="sheet-body"><form id="the-form" onsubmit="return false;">'+body+'</form></div><div class="sheet-foot"><button class="btn btn-g" onclick="closeModal()">Annuler</button><button class="btn btn-p" onclick="doSave()">Enregistrer</button></div></div></div>';
  document.getElementById('overlay').addEventListener('click',function(e){if(e.target.id==='overlay')closeModal();});
}

function closeModal(){document.getElementById('modal-root').innerHTML='';MODAL_ENTITY=null;MODAL_ID=null;}

function doSave(){
  var form=document.getElementById('the-form');
  if(!form){notif('Erreur : formulaire introuvable',false);return;}
  var f={};
  form.querySelectorAll('input,select').forEach(function(el){if(el.name)f[el.name]=el.value;});
  var KEY={vehicle:'vehicles',driver:'drivers',maintenance:'maintenances',insurance:'insurances',control:'controls',fuel:'fuelLogs',reservation:'reservations',repair:'repairs'};
  var dbKey=KEY[MODAL_ENTITY];
  if(!dbKey){notif('Erreur entité',false);return;}
  // Coercions
  if(MODAL_ENTITY==='vehicle'){f.mileage=parseInt(f.mileage)||0;f.year=parseInt(f.year)||2020;f.purchasePrice=parseFloat(f.purchasePrice)||0;}
  if(MODAL_ENTITY==='maintenance'){f.cost=parseFloat(f.cost)||0;f.mileageDone=parseInt(f.mileageDone)||0;f.nextMileage=parseInt(f.nextMileage)||0;}
  if(MODAL_ENTITY==='insurance')f.annualCost=parseFloat(f.annualCost)||0;
  if(MODAL_ENTITY==='control')f.cost=parseFloat(f.cost)||0;
  if(MODAL_ENTITY==='fuel'){f.liters=parseFloat(f.liters)||0;f.pricePerLiter=parseFloat(f.pricePerLiter)||0;f.totalCost=parseFloat(f.totalCost)||parseFloat((f.liters*f.pricePerLiter).toFixed(2));f.mileage=parseInt(f.mileage)||0;}
  if(MODAL_ENTITY==='reservation')f.status=f.status||'pending';
  if(MODAL_ENTITY==='repair'){f.cost=parseFloat(f.cost)||0;f.mileage=parseInt(f.mileage)||0;}
  // Update D
  if(MODAL_ID){D[dbKey]=D[dbKey].map(function(x){return x.id===MODAL_ID?Object.assign({},x,f):x;});}
  else{D[dbKey].push(Object.assign({},f,{id:uid()}));}
  closeModal();
  render();
  save(dbKey);
  notif('✓ Enregistré',true);
}

// ── Code screen ─────────────────────────────────────────────────
function checkCode(){
  var v=document.getElementById('code-in').value.trim().toUpperCase();
  if(CODES.indexOf(v)>=0){
    localStorage.setItem('vroum_code',v);
    document.getElementById('code-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    load();render();
  } else {
    document.getElementById('code-err').textContent='Code incorrect';
    setTimeout(function(){document.getElementById('code-err').textContent='';},2000);
  }
}
document.getElementById('code-btn').addEventListener('click',checkCode);
document.getElementById('code-in').addEventListener('keydown',function(e){if(e.key==='Enter')checkCode();});

// ── Init ────────────────────────────────────────────────────────
if(CODES.indexOf(localStorage.getItem('vroum_code'))>=0){
  document.getElementById('code-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  load();render();
}
</script>
</body>
</html>
